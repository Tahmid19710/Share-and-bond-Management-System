<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">


<head>

    <title>Share Transfer Approval</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


    <style>


        body{

            background:#f5f7fa;

        }


        .container{

            max-width:1200px;

        }


        .table{

            font-size:14px;

        }


        .card{

            border-radius:12px;

            box-shadow:0 5px 15px rgba(0,0,0,.08);

        }


        .btn-sm{

            padding:5px 10px;

            font-size:13px;

        }



        .page-title{

            font-size:28px;

            font-weight:500;

        }


    </style>


</head>




<body>



<div class="container mt-4">



    <div class="d-flex justify-content-between align-items-center mb-3">


        <div>


            <h2 class="page-title">

                <i class="fa fa-arrow-right-arrow-left"></i>

                Share Transfer Approval

            </h2>



            <p class="text-muted">

                Pending share transfer requests

            </p>


        </div>





        <a href="/checker/dashboard"

           class="btn btn-secondary btn-sm">


            <i class="fa fa-arrow-left"></i>

            Back


        </a>



    </div>







    <div class="card shadow-sm">


        <div class="card-body p-3">



            <table class="table table-bordered table-hover align-middle">



                <thead class="table-dark">


                <tr>


                    <th>
                        Request ID
                    </th>


                    <th>
                        Transaction ID
                    </th>


                    <th>
                        Maker
                    </th>


                    <th>
                        Status
                    </th>


                    <th>
                        Date
                    </th>


                    <th width="300">
                        Action
                    </th>


                </tr>


                </thead>




                <tbody id="transferTable">



                <tr th:each="req : ${requests}">


                    <td th:text="${req.requestId}">

                    </td>



                    <td th:text="${req.entityId}">

                    </td>



                    <td th:text="${req.makerId}">

                    </td>



                    <td>


<span class="badge bg-warning text-dark"

      th:text="${req.status}">

</span>


                    </td>



                    <td th:text="${req.createdAt}">

                    </td>



                    <td><!-- VIEW BUTTON -->


                        <a th:href="@{'/checker/share-transfer/view/' + ${req.requestId}}"

                           class="btn btn-primary btn-sm me-1">


                            <i class="fa fa-eye"></i>

                            View


                        </a>





                        <!-- APPROVE BUTTON -->


                        <form th:action="@{'/checker/approve/' + ${req.requestId}}"

                              method="post"

                              style="display:inline;">


                            <button class="btn btn-success btn-sm me-1">


                                <i class="fa fa-check"></i>

                                Approve


                            </button>


                        </form>






                        <!-- REJECT BUTTON -->


                        <form th:action="@{'/checker/reject/' + ${req.requestId}}"

                              method="post"

                              style="display:inline;">



                            <input type="hidden"

                                   name="remarks"

                                   value="Rejected by checker">



                            <button class="btn btn-danger btn-sm">


                                <i class="fa fa-times"></i>

                                Reject


                            </button>


                        </form>



                    </td>



                </tr>



                </tbody>



            </table>



        </div>


    </div>






    <!-- PAGINATION -->


    <div class="d-flex justify-content-center mt-3">


        <nav>


            <ul class="pagination pagination-sm">



                <li class="page-item">


                    <a class="page-link"

                       href="#"

                       onclick="previousPage()">


                        Previous


                    </a>


                </li>





                <li class="page-item active">


                    <a class="page-link">


                        1


                    </a>


                </li>





                <li class="page-item">


                    <a class="page-link"

                       href="#"

                       onclick="nextPage()">


                        Next


                    </a>


                </li>



            </ul>


        </nav>


    </div>





</div>







<script>


    let currentPage = 1;

    let rowsPerPage = 10;




    function showPage(){


        let rows =

            document.querySelectorAll("#transferTable tr");



        rows.forEach((row,index)=>{


            if(
                index >= (currentPage-1)*rowsPerPage
                &&
                index < currentPage*rowsPerPage
            )

            {

                row.style.display="";

            }

            else

            {

                row.style.display="none";

            }


        });


    }





    function nextPage(){


        let rows = document.querySelectorAll("#transferTable tr");


        if(currentPage * rowsPerPage < rows.length)

        {

            currentPage++;

            showPage();

        }


    }





    function previousPage(){


        if(currentPage > 1)

        {

            currentPage--;

            showPage();

        }


    }





    window.onload=function(){

        showPage();

    }



</script>




</body>


</html>
