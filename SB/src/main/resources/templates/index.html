<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">


<head>


    <title>
        IBBL Share System Login
    </title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


    <style>


        body{

            min-height:100vh;

            background:linear-gradient(
                    135deg,
                    #0f766e,
                    #064e3b
            );

            display:flex;

            justify-content:center;

            align-items:center;

        }



        .login-box{


            width:440px;

            background:white;

            padding:35px;

            border-radius:25px;

            box-shadow:
                    0 10px 30px rgba(0,0,0,.25);


        }



        .logo{

            text-align:center;

            margin-bottom:25px;

        }



        .logo h2{

            color:#14532d;

            font-weight:700;

        }



        .logo p{

            color:#666;

        }



        .btn-role{

            width:100%;

            padding:12px;

            margin-bottom:12px;

            border-radius:10px;

            font-size:16px;

        }



        .maker{

            border:2px solid #0d6efd;

            color:#0d6efd;

            background:white;

        }



        .maker:hover{

            background:#0d6efd;

            color:white;

        }




        .checker{

            border:2px solid #ffc107;

            color:#d39e00;

            background:white;

        }



        .checker:hover{

            background:#ffc107;

            color:white;

        }




        .approver{

            border:2px solid #212529;

            color:#212529;

            background:white;

        }



        .approver:hover{

            background:#212529;

            color:white;

        }



        .remote{


            background:#198754;

            color:white;

            font-weight:bold;


        }



        .remote:hover{


            background:#146c43;

            color:white;


        }




        .footer{


            text-align:center;

            margin-top:25px;

            font-size:13px;

            color:#777;


        }



    </style>


</head>



<body>


<div class="login-box">


    <div class="logo">


        <h2>

            <i class="fa fa-university"></i>

            IBBL Share and Bond Management System

        </h2>


        <p>

            Share and Bond Management System

        </p>


    </div>





    <button class="btn btn-role remote">


        <i class="fa fa-sign-in-alt"></i>

        REMOTE CASM LOGIN


    </button>


    <hr>



    <h6 class="text-danger">


        <i class="fa fa-flask"></i>

        TEST LOGIN — DEV/UAT ONLY


    </h6>


    <p class="text-muted">

        Bypass remote CASM callback token check.

    </p>
    <!-- ===============================
     ROLE LOGIN BUTTONS
     =============================== -->


    <a href="/auth/maker"
       class="btn btn-role maker">


        <i class="fa fa-user-edit"></i>

        Test Maker


    </a>




    <a href="/auth/checker"
       class="btn btn-role checker">


        <i class="fa fa-user-check"></i>

        Test Checker


    </a>




    <a href="/auth/approver"
       class="btn btn-role approver">


        <i class="fa fa-user-shield"></i>

        Test Approver


    </a>





    <div class="footer">


        Copyright © Software Division,

        Microfinance Department,

        ICTW, IBBPLC


    </div>



</div>


</body>


</html>
