<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Shareholder List</title>


    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <!-- AdminLTE -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0-beta3/dist/css/adminlte.min.css">


    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


    <!-- DataTables -->
    <link rel="stylesheet"
          href="https://cdn.datatables.net/2.0.8/css/dataTables.dataTables.min.css">



    <style>

        .content-wrapper{

            padding:20px;

        }


        .card{

            box-shadow:0 0 10px rgba(0,0,0,0.1);

        }


    </style>


</head>




<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">



<div class="app-wrapper">



    <!-- NAVBAR -->

    <nav class="app-header navbar navbar-expand bg-body">


        <ul class="navbar-nav">


            <li class="nav-item">

                <a class="nav-link" data-lte-toggle="sidebar">

                    <i class="fa-solid fa-bars"></i>

                </a>

            </li>



            <li class="nav-item">

                <a class="nav-link">

                    Shareholder Management System

                </a>

            </li>


        </ul>


    </nav>







    <!-- SIDEBAR -->


    <aside class="app-sidebar bg-dark shadow"
           data-bs-theme="dark">



        <div class="sidebar-brand">


            <a href="/shareholders"
               class="brand-link">


                <span class="brand-text fw-light">

                    IBBL Share System

                </span>


            </a>


        </div>





        <div class="sidebar-wrapper">


            <nav class="mt-2">


                <ul class="nav sidebar-menu flex-column">



                    <li class="nav-item">


                        <a href="/shareholders"
                           class="nav-link active">


                            <i class="nav-icon fa-solid fa-users"></i>


                            <p>
                                Shareholders
                            </p>


                        </a>


                    </li>



                </ul>


            </nav>


        </div>


    </aside>

    <!-- CONTENT -->


    <main class="app-main">


        <div class="content-wrapper">


            <div class="container-fluid">



                <div class="card">



                    <div class="card-header d-flex justify-content-between align-items-center">


                        <h3 class="card-title mb-0">

                            Share Holder List

                        </h3>



                        <a th:href="${#authorization.expression('hasRole(''MAKER'')')
            ? '/dashboard'
            : (#authorization.expression('hasRole(''CHECKER'')')
            ? '/checker/dashboard'
            : '/approver/dashboard')}"
                           class="btn btn-secondary">


                            <i class="fa fa-arrow-left"></i>

                            Back to Dashboard


                        </a>


                    </div>





                    <div class="card-body">



                        <table id="shareTable"
                               class="table table-bordered table-striped">



                            <thead class="table-dark">


                            <tr>


                                <th>OID</th>

                                <th>Folio BO</th>

                                <th>Customer Name</th>

                                <th>Phone</th>

                                <th>Email</th>

                                <th>Balance</th>

                                <th>Status</th>

                                <th>Action</th>


                            </tr>


                            </thead>


                        </table>



                    </div>



                </div>



            </div>


        </div>


    </main>



</div>









<!-- SCRIPTS -->


<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


<script src="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0-beta3/dist/js/adminlte.min.js"></script>


<script src="https://cdn.datatables.net/2.0.8/js/dataTables.min.js"></script>







<script>


    $(document).ready(function(){



        $('#shareTable').DataTable({


            processing:true,


            serverSide:true,



            ajax:{


                url:"/shareholders/data",

                type:"GET"


            },



            pageLength:10,



            lengthMenu:[

                [10,25,50,100],

                [10,25,50,100]

            ],






            columns:[



                {
                    data:"oid"
                },



                {
                    data:"folioBo"
                },



                {
                    data:"custName"
                },



                {
                    data:"phone"
                },



                {
                    data:"email",

                    defaultContent:""

                },



                {
                    data:"balance"
                },





                {

                    data:"status",


                    render:function(data,type,row){



                        if(data == 1){


                            return `

                        <span class="badge bg-success">
                            APPROVED
                        </span>

                        `;


                        }


                        else if(data == 0){


                            return `

                        <span class="badge bg-warning">
                            PENDING
                        </span>

                        `;


                        }


                        else{


                            return `

                        <span class="badge bg-secondary">
                            ${data}
                        </span>

                        `;


                        }


                    }


                },







                {


                    data:null,


                    orderable:false,



                    render:function(data,type,row){


                        return `


                    <a href="/shareholders/view/${row.oid}"
                       class="btn btn-info btn-sm">


                        <i class="fa fa-eye"></i>

                        View


                    </a>


                    `;


                    }


                }



            ]



        });



    });



</script>






</body>

</html>
