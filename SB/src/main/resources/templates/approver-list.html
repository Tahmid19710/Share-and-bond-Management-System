<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Approver Approval Queue</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <style>

        body{

            background:#f5f7f7;

        }


        .container{

            margin-top:40px;

        }


        .card{

            border-radius:15px;

            box-shadow:0 5px 15px #ddd;

        }


    </style>


</head>


<body>



<div class="container">



    <div class="card p-4">



        <h3 class="mb-4">

            Final Approval Queue

        </h3>




        <table class="table table-bordered table-striped">


            <thead class="table-dark">


            <tr>

                <th>Request ID</th>

                <th>Entity ID</th>

                <th>Operation</th>

                <th>Status</th>

                <th>Created At</th>

                <th>Action</th>


            </tr>


            </thead>



            <tbody>



            <tr th:each="request : ${requests}">



                <td th:text="${request.requestId}"></td>


                <td th:text="${request.entityId}"></td>


                <td th:text="${request.operationName}"></td>


                <td th:text="${request.status}"></td>


                <td th:text="${request.createdAt}"></td>



                <td>

                    <a th:href="@{/shareholders/view/{id}(id=${request.entityId},role='approver')}"
                       class="btn btn-info btn-sm">

                        <i class="fa fa-eye"></i>
                        View

                    </a>

                    <a th:href="@{/approver/approve/{id}(id=${request.requestId})}"
                       class="btn btn-success btn-sm">

                        Approve

                    </a>



                    <a th:href="@{/approver/reject/{id}(id=${request.requestId})}"
                       class="btn btn-danger btn-sm">

                        Reject

                    </a>



                </td>



            </tr>



            </tbody>



        </table>




        <a href="/approver/dashboard"
           class="btn btn-secondary">

            Back Dashboard

        </a>



    </div>



</div>



</body>


</html>
