<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Edit Shareholder</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0-beta3/dist/css/adminlte.min.css">


    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


</head>



<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">


<div class="app-wrapper">



    <!-- ================= NAVBAR ================= -->


    <nav class="app-header navbar navbar-expand bg-body">


        <ul class="navbar-nav">


            <li class="nav-item">

                <a class="nav-link"
                   data-lte-toggle="sidebar">

                    <i class="fa fa-bars"></i>

                </a>

            </li>



            <li class="nav-item">

                <a class="nav-link">

                    Edit Shareholder

                </a>

            </li>


        </ul>


    </nav>






    <!-- ================= SIDEBAR ================= -->


    <aside class="app-sidebar bg-dark shadow"
           data-bs-theme="dark">



        <div class="sidebar-brand">


            <a href="/shareholders"
               class="brand-link">


<span class="brand-text">

IBBL Share System

</span>


            </a>


        </div>





        <div class="sidebar-wrapper">


            <nav class="mt-2">


                <ul class="nav sidebar-menu flex-column">



                    <li class="nav-item">


                        <a href="/shareholders"
                           class="nav-link">


                            <i class="fa fa-users nav-icon"></i>


                            <p>

                                Shareholders

                            </p>


                        </a>


                    </li>





                    <li class="nav-item">


                        <a href="/shareholders/create"
                           class="nav-link">


                            <i class="fa fa-user-plus nav-icon"></i>


                            <p>

                                Create Shareholder

                            </p>


                        </a>


                    </li>



                </ul>


            </nav>


        </div>


    </aside>







    <!-- ================= CONTENT ================= -->


    <main class="app-main">


        <div class="container-fluid mt-4">



            <div class="card card-primary">



                <div class="card-header">


                    <h3 class="card-title">

                        Edit Shareholder

                    </h3>


                </div>







                <form th:action="@{/shareholders/update}"
                      th:object="${shareholder}"
                      method="post">



                    <div class="card-body">



                        <!-- Hidden ID -->

                        <input type="hidden"
                               th:field="*{oid}">






                        <div class="row">



                            <div class="col-md-6 mb-3">


                                <label>OID</label>


                                <input type="text"
                                       class="form-control"
                                       th:value="${shareholder.oid}"
                                       readonly>


                            </div>







                            <div class="col-md-6 mb-3">


                                <label>Folio BO</label>


                                <input type="text"
                                       class="form-control"
                                       th:field="*{folioBo}"
                                       required>


                            </div>







                            <div class="col-md-6 mb-3">


                                <label>Customer Name</label>


                                <input type="text"
                                       class="form-control"
                                       th:field="*{custName}"
                                       required>


                            </div>







                            <div class="col-md-6 mb-3">


                                <label>Phone</label>


                                <input type="text"
                                       class="form-control"
                                       th:field="*{phone}">


                            </div>







                            <div class="col-md-6 mb-3">


                                <label>Email</label>


                                <input type="email"
                                       class="form-control"
                                       th:field="*{email}">


                            </div>







                            <div class="col-md-6 mb-3">


                                <label>Shares</label>


                                <input type="number"
                                       class="form-control"
                                       th:field="*{shares}">


                            </div>







                            <div class="col-md-6 mb-3">


                                <label>Balance</label>


                                <input type="number"
                                       step="0.01"
                                       class="form-control"
                                       th:field="*{balance}">


                            </div>







                            <div class="col-md-6 mb-3">


                                <label>Status</label>


                                <input type="number"
                                       class="form-control"
                                       th:field="*{status}">


                            </div>





                        </div>


                    </div>







                    <div class="card-footer">


                        <button type="submit"
                                class="btn btn-primary">

                            <i class="fa fa-save"></i>

                            Update

                        </button>





                        <a href="/shareholders"
                           class="btn btn-secondary">

                            Cancel

                        </a>



                    </div>





                </form>




            </div>



        </div>


    </main>



</div>







<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


<script src="https://cdn.jsdelivr.net/npm/admin-lte@4.0.0-beta3/dist/js/adminlte.min.js"></script>



</body>

</html>
