<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">


<head>


    <meta charset="UTF-8">


    <title>
        Role Login
    </title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">



    <style>


        body{

            min-height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            background:linear-gradient(
                    135deg,
                    #e8f5ee,
                    #f8fafc
            );

        }



        .login-card{


            width:420px;

            background:white;

            padding:40px;

            border-radius:20px;

            box-shadow:
                    0 15px 35px rgba(0,0,0,.15);


        }



        .logo{

            text-align:center;

            color:#087443;

            font-size:28px;

            font-weight:bold;

            margin-bottom:20px;

        }



        .role-icon{


            width:80px;

            height:80px;

            background:#e8f5ee;

            color:#087443;

            border-radius:50%;

            display:flex;

            justify-content:center;

            align-items:center;

            margin:auto;

            font-size:35px;


        }



        .role-title{


            text-align:center;

            margin-top:20px;

            font-weight:700;

            color:#333;


        }



        .role-desc{


            text-align:center;

            color:#777;

            margin-bottom:30px;


        }



        .form-control{


            height:50px;

            border-radius:10px;


        }



        .btn-login{


            height:50px;

            border-radius:10px;

            background:#087443;

            color:white;

            font-weight:bold;


        }



        .btn-login:hover{


            background:#065c35;

            color:white;


        }



    </style>


</head>



<body>



<div class="login-card">



    <div class="logo">

        <i class="fa-solid fa-building-columns"></i>

        IBBL SB

    </div>





    <div class="role-icon">


        <i th:if="${role=='Maker'}"
           class="fa-solid fa-user-pen">
        </i>



        <i th:if="${role=='Checker'}"
           class="fa-solid fa-circle-check">
        </i>



        <i th:if="${role=='Approver'}"
           class="fa-solid fa-shield-halved">
        </i>



    </div>






    <h3 class="role-title">


        <span th:text="${role}">
            Maker
        </span>

        Login Portal


    </h3>






    <p class="role-desc">


        <span th:if="${role=='Maker'}">

            Create and modify shareholder information

        </span>


        <span th:if="${role=='Checker'}">

            Review and verify pending shareholder requests

        </span>



        <span th:if="${role=='Approver'}">

            Final approval of verified requests

        </span>


    </p>





    <div th:if="${param.error}"
         class="alert alert-danger">

        Invalid login for this role.

    </div>

    <form th:action="@{/login}"
          method="post">


        <input type="hidden"
               name="expectedRole"
               th:value="${role}">




        <div class="mb-3">


            <label class="fw-semibold">

                Username

            </label>


            <input type="text"

                   name="username"

                   class="form-control"

                   placeholder="Enter username"

                   required>


        </div>







        <div class="mb-3">


            <label class="fw-semibold">

                Password

            </label>


            <input type="password"

                   name="password"

                   class="form-control"

                   placeholder="Enter password"

                   required>


        </div>







        <button class="btn btn-login w-100">


            <i class="fa-solid fa-right-to-bracket"></i>

            Login


        </button>





    </form>







    <div class="text-center mt-4">


        <a href="/"
           class="text-decoration-none text-muted">


            ← Back to Main Page


        </a>


    </div>





</div>




</body>


</html>
