<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Modify Shareholder</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">



    <style>


        body{

            background:#f5f7f7;

        }



        .container{

            max-width:1100px;

        }



        .card{

            margin:10px auto;

            border-radius:12px;

            box-shadow:0 3px 10px #ddd;

        }



        .card-body{

            padding:15px;

        }



        .section-title{

            padding:7px 12px;

            color:white;

            font-weight:bold;

            border-radius:5px;

            font-size:15px;

        }



        .section-title-gray{

            padding:7px 12px;

            color:#333;

            font-weight:bold;

            border-radius:5px;

            font-size:15px;

            background:#e9ecef;

        }



        .info-box{

            margin-bottom:8px;

        }



        label{

            font-weight:bold;

            font-size:14px;

            margin-bottom:3px;

        }



        .form-control{

            height:35px;

            font-size:14px;

        }



        textarea.form-control{

            height:70px;

        }


    </style>


</head>



<body>



<div class="container">



    <h3 class="mt-3 text-success">

        <i class="fa fa-edit"></i>

        Modify Shareholder

    </h3>





    <form th:action="@{/maker/resubmit/{id}(id=${requestId})}"
          method="post">





        <!-- ================= BASIC INFO ================= -->


        <div class="card">


            <div class="card-body">



                <div class="section-title bg-success">

                    Basic Information

                </div>



                <br>


                <div class="row">



                    <div class="col-md-6 info-box">


                        <label>Folio BO</label>


                        <input type="text"
                               class="form-control"
                               name="folioBo"
                               th:value="${shareholder.folioBo}">


                    </div>





                    <div class="col-md-6 info-box">


                        <label>Customer Name</label>


                        <input type="text"
                               class="form-control"
                               name="custName"
                               th:value="${shareholder.custName}">


                    </div>





                    <div class="col-md-6 info-box">


                        <label>Phone</label>


                        <input type="text"
                               class="form-control"
                               name="phone"
                               th:value="${shareholder.phone}">


                    </div>





                    <div class="col-md-6 info-box">


                        <label>Email</label>


                        <input type="email"
                               class="form-control"
                               name="email"
                               th:value="${shareholder.email}">


                    </div>



                </div>



            </div>


        </div><!-- ================= ADDRESS + BANK ================= -->


        <div class="row">


            <!-- ================= ADDRESS ================= -->


            <div class="col-md-6">


                <div class="card">


                    <div class="card-body">



                        <div class="section-title-gray">

                            <i class="fa fa-location-dot"></i>

                            Address Information

                        </div>



                        <br>



                        <div th:if="${address != null}">


                            <div class="row">



                                <div class="col-md-6 info-box">


                                    <label>Address 1</label>


                                    <input class="form-control"
                                           name="add1"
                                           th:value="${address.add1}">


                                </div>





                                <div class="col-md-6 info-box">


                                    <label>Address 2</label>


                                    <input class="form-control"
                                           name="add2"
                                           th:value="${address.add2}">


                                </div>





                                <div class="col-md-6 info-box">


                                    <label>Address 3</label>


                                    <input class="form-control"
                                           name="add3"
                                           th:value="${address.add3}">


                                </div>





                                <div class="col-md-6 info-box">


                                    <label>Address 4</label>


                                    <input class="form-control"
                                           name="add4"
                                           th:value="${address.add4}">


                                </div>




                            </div>


                        </div>



                        <div th:if="${address == null}">

                            No Address Information

                        </div>



                    </div>


                </div>


            </div>







            <!-- ================= BANK ================= -->


            <div class="col-md-6">


                <div class="card">


                    <div class="card-body">



                        <div class="section-title-gray">

                            <i class="fa fa-building-columns"></i>

                            Bank Information

                        </div>



                        <br>




                        <div th:if="${bank != null}">


                            <div class="row">





                                <div class="col-md-6 info-box">


                                    <label>Bank Name</label>


                                    <input class="form-control"
                                           name="bankName"
                                           th:value="${bank.bankName}">


                                </div>





                                <div class="col-md-6 info-box">


                                    <label>Account No</label>


                                    <input class="form-control"
                                           name="accNo"
                                           th:value="${bank.accNo}">


                                </div>





                                <div class="col-md-6 info-box">


                                    <label>Branch Name</label>


                                    <input class="form-control"
                                           name="branchName"
                                           th:value="${bank.branchName}">


                                </div>





                                <div class="col-md-6 info-box">


                                    <label>Routing No</label>


                                    <input class="form-control"
                                           name="routingNo"
                                           th:value="${bank.routingNo}">


                                </div>





                            </div>


                        </div>




                        <div th:if="${bank == null}">

                            No Bank Information

                        </div>




                    </div>


                </div>


            </div>



        </div>








        <!-- ================= BUTTON ================= -->


        <div class="card">


            <div class="card-body">



                <button type="submit"
                        class="btn btn-success">


                    <i class="fa fa-paper-plane"></i>

                    Resubmit To Checker


                </button>




                <a href="/dashboard?role=maker"
                   class="btn btn-secondary">


                    <i class="fa fa-home"></i>

                    Back Dashboard


                </a>





                <a href="/maker/modification"
                   class="btn btn-primary">


                    <i class="fa fa-arrow-left"></i>

                    Back List


                </a>




            </div>


        </div>




    </form>



</div>



</body>


</html>
