<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - IBBL SB</title>

    <!-- Bootstrap 5 -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

</head>

<body class="bg-light">

<div class="container min-vh-100 d-flex
            align-items-center justify-content-center">

    <div class="card border-0 shadow-lg
                rounded-4 overflow-hidden"
         style="max-width: 950px; width: 100%;">

        <div class="row g-0">

            <!-- ================= LEFT SIDE ================= -->
            <div class="col-md-6 bg-white p-5">

                <div class="h-100 d-flex flex-column
                            justify-content-center">

                    <!-- Logo -->
                    <div class="mb-4">

                        <h3 class="fw-bold text-success">
                            IBBL SB
                        </h3>

                        <p class="text-muted">
                            Secure Banking System
                        </p>

                    </div>


                    <!-- Heading -->
                    <h1 class="fw-bold">
                        Welcome Back
                    </h1>

                    <p class="text-muted mb-4">
                        Login to access your account
                    </p>


                    <!-- ================= ERROR MESSAGE ================= -->

                    <div th:if="${param.error}"
                         class="alert alert-danger"
                         role="alert">

                        Invalid email or password.

                    </div>


                    <!-- ================= LOGOUT MESSAGE ================= -->

                    <div th:if="${param.logout}"
                         class="alert alert-success"
                         role="alert">

                        You have been logged out successfully.

                    </div>


                    <!-- ================= LOGIN FORM ================= -->

                    <form th:action="@{/login}"
                          method="post">

                        <!-- Email -->
                        <div class="mb-3">

                            <label for="username"
                                   class="form-label fw-semibold">

                                Email

                            </label>

                            <input type="text"
                                   id="username"
                                   name="username"
                                   class="form-control form-control-lg"
                                   placeholder="Enter your email"
                                   required>

                        </div>


                        <!-- Password -->
                        <div class="mb-3">

                            <label for="password"
                                   class="form-label fw-semibold">

                                Password

                            </label>

                            <input type="password"
                                   id="password"
                                   name="password"
                                   class="form-control form-control-lg"
                                   placeholder="Enter your password"
                                   required>

                        </div>


                        <!-- Remember Me + Forgot Password -->
                        <div class="d-flex
                                    justify-content-between
                                    align-items-center mb-4">

                            <div class="form-check">

                                <input
                                        class="form-check-input"
                                        type="checkbox"
                                        id="remember-me"
                                        name="remember-me">

                                <label
                                        class="form-check-label text-muted"
                                        for="remember-me">

                                    Remember me

                                </label>

                            </div>


                            <a th:href="@{/forgot-password}"
                               class="text-success
                                      text-decoration-none">

                                Forgot Password?

                            </a>

                        </div>


                        <!-- Login Button -->
                        <button type="submit"
                                class="btn btn-success
                                       btn-lg w-100">

                            Login

                        </button>

                    </form>

                </div>

            </div>


            <!-- ================= RIGHT SIDE ================= -->

            <div class="col-md-6 d-none d-md-block">

                <div class="position-relative h-100">

                    <img
                            src="https://images.unsplash.com/photo-1556742049-0cfed4f6a45d?auto=format&fit=crop&w=1000&q=80"
                            alt="Banking"
                            class="w-100 h-100"
                            style="object-fit: cover;">

                    <!-- Overlay -->
                    <div class="position-absolute
                                top-0 start-0
                                w-100 h-100
                                bg-success bg-opacity-75
                                d-flex
                                align-items-center
                                justify-content-center
                                text-center
                                text-white p-5">

                        <div>

                            <h2 class="fw-bold mb-3">
                                Secure Banking
                            </h2>

                            <p class="lead">
                                Simple, secure and convenient
                                banking management system.
                            </p>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- Bootstrap JS -->
<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
