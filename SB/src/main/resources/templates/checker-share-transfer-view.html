<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">


<head>

    <title>Share Transfer Details</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">



    <style>


        body{

            background:#f5f7fa;

        }


        .container{

            max-width:1100px;

        }


        .card{

            border-radius:14px;

            box-shadow:0 5px 15px rgba(0,0,0,.08);

        }


        .title{

            font-size:28px;

            font-weight:500;

        }



        .table{

            font-size:14px;

        }



        .label{

            font-weight:600;

            color:#555;

        }


        .value{

            font-weight:500;

        }


    </style>


</head>




<body>


<div class="container mt-4">



    <div class="d-flex justify-content-between align-items-center mb-3">


        <h2 class="title">

            <i class="fa fa-eye"></i>

            Share Transfer Details

        </h2>



        <a th:href="${fromChecker} ? '/checker/share-transfer' : '/maker/share-transfer'"
           class="btn btn-secondary btn-sm">

            <i class="fa fa-arrow-left"></i>
            Back

        </a>

        

    </div>





    <!-- REQUEST INFORMATION -->


    <div class="card mb-4">


        <div class="card-body">


            <h5 class="mb-3">

                Request Information

            </h5>



            <div class="row">


                <div class="col-md-4">

<span class="label">
Request ID:
</span>

                    <span class="value"
                          th:text="${request.requestId}">
</span>

                </div>



                <div class="col-md-4">

<span class="label">
Transaction ID:
</span>

                    <span class="value"
                          th:text="${request.entityId}">
</span>

                </div>



                <div class="col-md-4">

<span class="label">
Maker:
</span>

                    <span class="value"
                          th:text="${request.makerId}">
</span>

                </div>



            </div>




            <div class="row mt-3">


                <div class="col-md-4">

<span class="label">
Status:
</span>

                    <span class="badge bg-warning"
                          th:text="${request.status}">
</span>


                </div>




                <div class="col-md-4">

<span class="label">
Created:
</span>

                    <span th:text="${request.createdAt}">
</span>


                </div>



                <div class="col-md-4">

<span class="label">
Operation:
</span>

                    <span th:text="${request.operationName}">
</span>


                </div>



            </div>



        </div>

    </div>








    <!-- TRANSACTION DETAILS -->


    <div class="card">


        <div class="card-body">


            <h5 class="mb-3">

                Transaction Details

            </h5>



            <table class="table table-bordered table-hover">


                <thead class="table-dark">


                <tr>


                    <th>Folio BO</th>

                    <th>Type</th>

                    <th>Code</th>

                    <th>Debit Share</th>

                    <th>Credit Share</th>

                    <th>Contra Account</th>

                    <th>Valid</th>


                </tr>


                </thead>



                <tbody>



                <tr th:each="tr : ${transfers}">


                    <td th:text="${tr.folioBo}">
                    </td>



                    <td th:text="${tr.trType}">
                    </td>



                    <td th:text="${tr.trCode}">
                    </td>



                    <td th:text="${tr.drShare}">
                    </td>



                    <td th:text="${tr.crShare}">
                    </td>



                    <td th:text="${tr.contraAcc}">
                    </td>



                    <td>


<span class="badge bg-secondary"

      th:text="${tr.isValid}">

</span>


                    </td>



                </tr>



                </tbody>



            </table>



        </div>


    </div>






</div>



</body>


</html>
