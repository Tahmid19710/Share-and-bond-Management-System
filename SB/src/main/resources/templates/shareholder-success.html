<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>Shareholder Created</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
          rel="stylesheet">


    <style>


        body{

            min-height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            background:linear-gradient(135deg,#eef8f2,#f5f7fb);

            font-family:'Segoe UI',sans-serif;

        }



        .success-card{


            width:450px;

            background:white;

            padding:40px 35px;

            border-radius:20px;

            text-align:center;

            box-shadow:0 15px 35px rgba(0,0,0,.15);

            animation:fadeIn .6s ease;


        }



        .icon-circle{


            width:90px;

            height:90px;

            background:#198754;

            color:white;

            border-radius:50%;

            display:flex;

            justify-content:center;

            align-items:center;

            margin:auto;

            font-size:45px;


        }



        h2{

            margin-top:25px;

            color:#087443;

            font-weight:700;

        }



        .folio-box{


            margin:25px 0;

            background:#f1f8f4;

            border-left:5px solid #087443;

            padding:15px;

            border-radius:10px;


        }



        .folio-title{

            color:#555;

            font-size:15px;

        }



        .folio-number{

            font-size:32px;

            font-weight:bold;

            color:#087443;

        }



        .message{


            color:#666;

            line-height:1.6;

            margin-bottom:25px;

        }



        .btn-custom{


            padding:10px 22px;

            border-radius:8px;

            font-weight:600;

            margin:5px;


        }



        @keyframes fadeIn{


            from{

                opacity:0;

                transform:translateY(20px);

            }


            to{

                opacity:1;

                transform:translateY(0);

            }

        }


    </style>


</head>



<body>



<div class="success-card">


    <div class="icon-circle">

        <i class="fa-solid fa-check"></i>

    </div>



    <h2>
        Shareholder Created Successfully
    </h2>



    <div class="folio-box">


        <div class="folio-title">

            Your Folio BO Number

        </div>


        <div class="folio-number"
             th:text="${folioBo}">

            500013

        </div>


    </div>




    <div class="message">


        Shareholder information has been submitted successfully.


        <br>


        Your request is now waiting for

        <b>Checker Approval</b>.



    </div>



    <a href="/shareholders/create"
       class="btn btn-success btn-custom">


        <i class="fa-solid fa-plus"></i>

        Create Another


    </a>



    <a href="/dashboard?role=maker"
       class="btn btn-secondary btn-custom">


        <i class="fa-solid fa-house"></i>

        Dashboard


    </a>



</div>



</body>


</html>
