<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">


<head>

    <title>Approver Dashboard</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


    <style>


        body{

            background:#f5f7fa;

        }



        .dashboard-title{

            font-size:34px;

            font-weight:500;

        }



        .role-text{

            font-size:17px;

        }



        .dashboard-card{


            background:white;

            border-radius:18px;

            padding:22px;

            height:190px;

            box-shadow:0 6px 15px rgba(0,0,0,.08);


        }



        .card-icon{


            font-size:32px;

            color:#198754;


        }



        .card-title{

            font-size:24px;

            font-weight:500;

            margin-top:10px;

        }



        .card-text{

            font-size:15px;

            color:#555;

        }



        .logout-btn{


            background:#dc3545;

            color:white;

            border-radius:8px;

            padding:8px 18px;

            font-size:15px;


        }



        .logout-btn:hover{

            background:#bb2d3b;

            color:white;

        }


    </style>


</head>



<body>



<div class="container-fluid">



    <div class="row">



        <!-- MAIN CONTENT -->

        <div class="col-md-12 p-5">



            <div class="d-flex justify-content-between align-items-start">


                <div>


                    <h1 class="dashboard-title">

                        Dashboard Overview

                    </h1>


                    <p class="role-text">

                        Current Role:

                        <b>Approver</b>

                    </p>


                </div>





                <form th:action="@{/logout}" method="post">


                    <button class="btn logout-btn">


                        <i class="fa fa-sign-out-alt"></i>

                        Logout


                    </button>


                </form>



            </div>







            <div class="row mt-4 g-4">






                <!-- FINAL APPROVAL CARD -->


                <div class="col-md-6">


                    <div class="dashboard-card">



                        <div class="card-icon">

                            <i class="fa fa-shield-halved"></i>

                        </div>




                        <h3 class="card-title">

                            Final Approval

                        </h3>



                        <p class="card-text">

                            Approve or reject checker verified requests

                        </p>




                        <a href="/approver/list"

                           class="btn btn-success">


                            Open


                        </a>




                    </div>


                </div>









                <!-- SHAREHOLDER LIST CARD -->


                <div class="col-md-6">


                    <div class="dashboard-card">



                        <div class="card-icon">

                            <i class="fa fa-users"></i>

                        </div>




                        <h3 class="card-title">

                            Share Holder List

                        </h3>




                        <p class="card-text">

                            View all shareholder information

                        </p>




                        <a href="/shareholders"

                           class="btn btn-primary">


                            Open


                        </a>



                    </div>


                </div>






            </div>




        </div>



    </div>



</div>



</body>


</html>
